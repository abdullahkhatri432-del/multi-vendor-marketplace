name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit + serverless regression tests (node:test, no browser required).
      - run: npm test

      # Production build. Vercel serves this app from the domain root.
      - run: npm run build
